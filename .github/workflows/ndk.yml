name: Build Android Static Libraries

on:
  push:
    branches:
      - develop
      - master
  pull_request:

jobs:
  build-android:
    name: Build Android Static Libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          local-cache: true

      - name: Configure and Build
        shell: bash
        run: |
          mkdir -p build
          cd build
          
          CMAKE_OPTIONS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_PLATFORM=28 \
            -DCMAKE_CXX_STANDARD=20 \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLFIO_BUILD_TESTS=OFF"

          cmake .. $CMAKE_OPTIONS
          cmake --build . --config Release

      - name: Debug - List Build Directory
        shell: bash
        run: |
          echo "Listing build directory contents:"
          ls -R build/

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p llfio/lib/${{ matrix.abi }}
          
          # Try different possible locations
          if [ -f "build/libllfio.a" ]; then
            cp build/libllfio.a llfio/lib/${{ matrix.abi }}/
          elif [ -f "build/lib/libllfio.a" ]; then
            cp build/lib/libllfio.a llfio/lib/${{ matrix.abi }}/
          elif [ -f "build/src/libllfio.a" ]; then
            cp build/src/libllfio.a llfio/lib/${{ matrix.abi }}/
          elif [ -f "build/Release/libllfio.a" ]; then
            cp build/Release/libllfio.a llfio/lib/${{ matrix.abi }}/
          else
            echo "Error: Cannot find libllfio.a"
            find build -name "libllfio.a"
            exit 1
          fi
          
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            cp -r include llfio/
          fi

      - name: Upload partial artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llfio-android-${{ matrix.abi }}
          path: llfio/
          retention-days: 1

  create-zip:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: llfio-android-*
          merge-multiple: true

      - name: Create ZIP
        run: |
          cd artifacts
          zip -r ../llfio-android.zip llfio/

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: llfio-android
          path: llfio-android.zip
          retention-days: 7
