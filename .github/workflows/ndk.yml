name: Build Android Static Libraries

on:
  push:
    branches:
      - develop
      - master
  pull_request:

jobs:
  build-android:
    name: Build Android Static Libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        configuration: [error_code, status_code]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          local-cache: true

      - name: Configure and Build
        shell: bash
        run: |
          mkdir -p build
          cd build
          
          CMAKE_OPTIONS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_PLATFORM=28 \
            -DCMAKE_CXX_STANDARD=20 \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF"

          if [ "${{ matrix.configuration }}" = "status_code" ]; then
            CMAKE_OPTIONS="$CMAKE_OPTIONS -DLLFIO_USE_EXPERIMENTAL_SG14_STATUS_CODE=ON"
          fi

          cmake .. $CMAKE_OPTIONS
          cmake --build . --config Release

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/lib/${{ matrix.abi }}
          cp build/lib/libllfio.a artifacts/lib/${{ matrix.abi }}/
          cp -r include artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llfio-android-${{ matrix.abi }}-${{ matrix.configuration }}
          path: artifacts/
          retention-days: 7

      - name: Create combined artifact
        if: matrix.configuration == 'error_code' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          mkdir -p combined/llfio/lib/${{ matrix.abi }}
          cp build/lib/libllfio.a combined/llfio/lib/${{ matrix.abi }}/
          cp -r include combined/llfio/

      - name: Upload combined artifact
        if: matrix.configuration == 'error_code' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: llfio-android
          path: combined/
          retention-days: 7
